[project]
name = "stac-gti-xarray"
version = "0.1.0"
description = "Construct xarray DataArrays from STAC items using GDAL's GTI driver"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "dask>=2025.11.0",
    "rasterio>=1.5.0",
    "rioxarray>=0.20.0",
    "rustac>=0.9.8",
    "xarray>=2025.10.1",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
no-binary-package = ["rasterio"]

[tool.ruff]
exclude = [
    "docs/examples/example_*.py",
    "_obstore",
]

[tool.ruff.lint.per-file-ignores]
"python/rustac/__init__.py" = ["F403", "F405"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-m 'not integration' --disable-socket --allow-unix-socket"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "mypy>=1.20.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-socket>=0.7.0",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
